services:
  - type: web
    name: elderly-anti-scam
    env: python
    plan: free
    buildCommand: |
      export PIP_CACHE_DIR=/tmp/pip-cache
      pip install --cache-dir /tmp/pip-cache -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PIP_CACHE_DIR
        value: /tmp/pip-cache
      - key: TMPDIR
        value: /tmp
      - key: GEMINI_API_KEY
        sync: false